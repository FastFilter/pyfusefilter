# Configuration for cibuildwheel (used by .github/workflows/wheels.yml).
# cibuildwheel 4 builds CPython 3.9-3.15 and the free-threaded 3.14t/3.15t
# wheels by default.

[tool.cibuildwheel]
test-requires = ["pytest"]
test-command = "pytest {project}/tests -q --import-mode=importlib"

[tool.cibuildwheel.macos]
archs = ["x86_64", "universal2", "arm64"]

[tool.cibuildwheel.linux]
# The workflow runs on both x86_64 and aarch64 runners; build natively on each.
archs = ["native"]

[tool.cibuildwheel.pyodide]
# WebAssembly wheels, one per Pyodide ABI (cp313: Pyodide 0.28 and 0.29;
# cp314: Pyodide 314; cp315). In a Pyodide venv, the pytest script starts
# with a shebang to a shell script, which macOS cannot run: python -m pytest.
test-command = "python -m pytest {project}/tests -q --import-mode=importlib"

[tool.cibuildwheel.windows]
archs = ["AMD64"]
